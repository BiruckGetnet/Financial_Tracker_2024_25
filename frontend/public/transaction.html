<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Dashboard</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .btn-custom {
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card {
            transition: box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        } 
        
    </style>
</head>

<body>
    <header class="bg-primary text-white py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1 class="mb-0 fw-bold">Personal Finance Dashboard</h1>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <a href="javascript:void(0);" id="logoutButton" class="btn btn-outline-light btn-custom">Logout</a>
                </div>
                
            </div>
        </div>
    </header>
    <!-- Main Container -->
    <div class="container">
        <h2>Expense Dashboard</h2>
        
        <!-- Expense Form -->
        <form id="expenseForm">
            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" class="form-control" id="amount" required>
            </div>
            <div class="form-group">
                <label for="type">Type:</label>
                <input type="text" class="form-control" id="type" required>
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <input type="text" class="form-control" id="description" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Expense</button>
        </form>

        <!-- Expense List -->
        <div class="expense-list">
            <h3>Your Expenses:</h3>
            <ul id="expenseList" class="list-group"></ul>
        </div>
    </div>

    <!-- JavaScript Section -->
    <script src="../src/transaction.ts"></script>
</body>
</html>
